services:
  tracker:
    build: .
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080", "--data", "/data/expense-tracker.json", "--web", "/app/web"]
    expose:
      - "8080"
    volumes:
      - tracker_data:/data
    networks:
      - tracker_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in your .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tracker
    networks:
      - tracker_net

networks:
  tracker_net:

volumes:
  tracker_data:
  caddy_data:
  caddy_config:
